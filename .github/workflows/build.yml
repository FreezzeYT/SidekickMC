name: Build Linux Binary

on:
  push:
    branches: [ "main", "master", "feat-Linux-support" ]
  pull_request:
    branches: [ "main", "master", "feat-Linux-support" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Linux Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libudev-dev

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build release binary with LTO
      working-directory: sidekickmc-linux
      run: cargo build --release

    - name: Upload compiled binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sidekickmc-linux-x86_64
        path: sidekickmc-linux/target/release/sidekickmc
